<!DOCTYPE html>
<html lang="ro">
<head>
    <link rel="stylesheet" href="../css/stiluri.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componente PC - TopTech</title>
</head>
<body>

    <header>
        <h1><a href="../index.html">TopTech</a></h1>
        <nav>
            <a href="../index.html">Acasă</a> | 
            <a href="cos.html">Coș (0)</a> </nav>
    </header>

    <main>
        <nav aria-label="breadcrumb">
            <p id="breadcrumb">Acasă > <a href="../index.html">Categorii</a> > <strong>Categorie</strong></p>
        </nav>

        <div style="display: flex; gap: 20px;">
            <aside style="width: 250px; padding: 15px; border-right: 1px solid #ddd;">
                <h3>Filtrează</h3>
                <form id="formular-filtre" onsubmit="return false;">
                    <h4>Preț</h4>
                    <input type="range" min="0" max="50000" id="filter-pret" value="50000">
                    <p id="range-pret">0 - 50.000 MDL</p>

                    <h4>Brand</h4>
                    <input type="checkbox" id="samsung" name="brand" value="Samsung"> <label for="samsung">Samsung</label><br>
                    <input type="checkbox" id="kingston" name="brand" value="Kingston"> <label for="kingston">Kingston</label><br>
                    <input type="checkbox" id="nvidia" name="brand" value="Nvidia"> <label for="nvidia">Nvidia</label><br>

                    <br>
                    <button type="button" id="aplica-filtre">Aplică Filtre</button>
                </form>
            </aside>

            <section style="flex-grow: 1;">
                <h2 id="titlu-categorie">Categorie</h2>
                <p id="numar-produse">Se încarcă produsele...</p>
                <div class="grid-produse" id="grid-produse"></div>
            </section>
        </div>
    </main>

<footer class="footer-principal">
    <section class="footer-sectiune">
        <h4 class="footer-titlu">Informații Clienți</h4>
        <ul class="footer-lista">

    </section>

    <script src="../javascript/auth.js"></script>
    <script src="../javascript/gestionare_cos.js"></script>
    <script src="../javascript/categorie_page.js"></script>
</footer>

</body>
</html>
