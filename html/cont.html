<!DOCTYPE html>
<html lang="ro">
<head>
    <link rel="stylesheet" href="../css/stiluri.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare - TopTech</title>
</head>
<body>

    <header>
        <h1><a href="../index.html">TopTech</a></h1>
        <nav>
            <a href="../index.html">Acasă</a> | 
            <a href="cos.html">Coș (2)</a>
        </nav>
    </header>

    <main>
        <h2 class="auth-titlu">Contul meu</h2>

        <div class="auth-container"> 
            <section class="auth-sectiune">
                <h3>Logare în cont</h3>
                <form action="#" method="post">
                    <label for="email">Email:</label><br> 
                    <input type="email" id="email" name="email" required><br><br>
                    
                    <label for="pass">Parolă:</label><br>
                    <input type="password" id="pass" name="password" required><br><br>
                    
                    <button type="submit">Intră în cont</button>
                    <br><br>
                    <a href="#">Ai uitat parola?</a>
                </form>
            </section>

            <section class="auth-sectiune">
                <h3>Înregistrare</h3>
                <p>Creează un cont pentru a urmări comanda și a salva produsele favorite.</p>
                
                <form action="#" method="post">
                    <label for="nume">Nume complet:</label><br>
                    <input type="text" id="nume" name="nume" required><br><br>

                    <label for="email-nou">Email:</label><br>
                    <input type="email" id="email-nou" name="email" required><br><br>

                    <label for="telefon">Număr de telefon:</label><br>
                    <input type="tel" id="telefon" name="telefon" placeholder="0xx xxx xxx" required><br><br>

                    <label for="pass-nou">Parolă:</label><br>
                    <input type="password" id="pass-nou" name="password_nou" required><br><br>

                    <label for="pass-confirm">Confirmă parola:</label><br>
                    <input type="password" id="pass-confirm" name="password_confirm" required><br><br>

                    <button type="submit">Creează Cont</button>
                </form>
            </section>
        </div>
    </main>

<footer class="footer-principal">
    <section class="footer-sectiune">
        <h4 class="footer-titlu">Informații Clienți</h4>
        <ul class="footer-lista">
            <li><a href="html/info.html#retur" class="footer-link">Politica de retur</a></li>
            <li><a href="html/info.html#garantie" class="footer-link">Garanție</a></li>
            <li><a href="html/info.html#livrare" class="footer-link">Livrare</a></li>
        </ul>
    </section>
    <p class="footer-copyright">&copy; 2026 TopTech</p>
</footer>
</body>
</html>
