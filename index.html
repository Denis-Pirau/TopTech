<!DOCTYPE html>
<html lang="ro">
<head>
    <link rel="stylesheet" href="css/stiluri.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopTech - Magazin de Calculatoare</title>
</head>
<body>

    <header>
        <div id="logo">
            <h1><a href="index.html">TopTech</a></h1>
        </div>

        <form id="form-cautare" action="index.html" method="get" style="position:relative;">
            <input type="text" id="input-cautare" name="q" placeholder="Caută produse" autocomplete="off">
            <button type="submit">Caută</button>
            <div id="sugestii-cautare" style="display:none; position:absolute; top:100%; left:0; right:80px; background:white; z-index:1000; border:1px solid #ccc; max-height:200px; overflow-y:auto; color:black; text-align:left;"></div>
        </form>

        <nav>
            <ul>
                <li><a href="html/cont.html">Contul Meu</a></li>
                <li><a href="html/cos.html">Coș</a></li>
            </ul>
        </nav>
    </header>

    <nav id="meniu-categorii">
        <ul id="lista-categorii">
            <li>Se încarcă categoriile...</li>
        </ul>
    </nav>

    <main>
        <section id="produse">
            <h2 id="titlu-produse">Cele mai vândute produse</h2>
            <div class="grid-produse" id="grid-produse">
                <p>Se încarcă produsele...</p>
            </div>
        </section>
    </main>

    <footer class="footer-principal">
        <section class="footer-sectiune">
            <h4 class="footer-titlu">Informații Clienți</h4>
            <ul class="footer-lista">
                <li><a href="html/info.html#retur" class="footer-link">Politica de retur</a></li>
                <li><a href="html/info.html#garantie" class="footer-link">Garanție</a></li>
                <li><a href="html/info.html#livrare" class="footer-link">Livrare</a></li>
            </ul>
        </section>
        <p class="footer-copyright">&copy; 2026 TopTech</p>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="javascript/auth.js"></script>
    <script src="javascript/gestionare_cos.js"></script>
    <script src="javascript/categorii.js"></script>
    <script src="javascript/top_produse.js"></script>
</body>
</html>
